<ion-header class="login-header">
  <ion-toolbar>
    <a class="back-link" routerLink="/home" aria-label="Back to Dance Community">Back</a>
    <ion-title>Log In</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-heading">
      <p class="eyebrow">WELCOME BACK</p>
      <h1 id="login-heading">Log in to Learn 2 Step.</h1>
      <p class="intro">Use the email and password for your account.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" formControlName="email" autocomplete="email" inputmode="email" />
          <p class="field-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
            Enter a valid email address.
          </p>
        </div>
        <div class="field-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" formControlName="password" autocomplete="current-password" />
          <p class="field-error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
            Enter your password.
          </p>
        </div>
        <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
        <button class="submit-button" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Logging in…' : 'Log In' }}
        </button>
      </form>
      <p class="signup-prompt">New to Learn 2 Step? <a routerLink="/create-account">Create an account</a></p>
    </section>
  </main>
</ion-content>
